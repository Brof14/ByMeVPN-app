name: Verify restricted APK hosting SFTP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bymevpn-sftp-smoke-test
  cancel-in-progress: false

jobs:
  sftp-https-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SFTP upload is served over HTTPS and can be removed
        env:
          UPDATE_SSH_HOST: ${{ secrets.UPDATE_SSH_HOST }}
          UPDATE_SSH_USER: ${{ secrets.UPDATE_SSH_USER }}
          UPDATE_SSH_KEY: ${{ secrets.UPDATE_SSH_KEY }}
          UPDATE_SSH_KNOWN_HOSTS: ${{ secrets.UPDATE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$UPDATE_SSH_HOST" = "bymevpn.duckdns.org"
          test "$UPDATE_SSH_USER" = "bymevpn-release"
          test -n "$UPDATE_SSH_KEY"
          test -n "$UPDATE_SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$UPDATE_SSH_KEY" > "$HOME/.ssh/update_deploy_key"
          printf '%s\n' "$UPDATE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/update_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$UPDATE_SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | grep -Fq \
            'SHA256:qm99nR8xq7zOZe+cxke5cVaXm2Op/08ck0o8oNDb/pQ'

          marker="sftp-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          marker_file="$RUNNER_TEMP/$marker"
          printf 'ByMeVPN SFTP smoke test %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$marker_file"
          uploaded=0
          cleanup() {
            if [ "$uploaded" = 1 ]; then
              printf 'rm "app/downloads/%s"\n' "$marker" > "$HOME/.ssh/remove.batch"
              sftp -q -b "$HOME/.ssh/remove.batch" -i "$HOME/.ssh/update_deploy_key" \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$UPDATE_SSH_USER@$UPDATE_SSH_HOST" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          printf 'put "%s" "app/downloads/%s"\n' "$marker_file" "$marker" > "$HOME/.ssh/upload.batch"
          uploaded=1
          sftp -q -b "$HOME/.ssh/upload.batch" -i "$HOME/.ssh/update_deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$UPDATE_SSH_USER@$UPDATE_SSH_HOST"

          curl --fail --silent --show-error --max-time 20 \
            "https://bymevpn.duckdns.org/app/downloads/$marker" -o "$RUNNER_TEMP/downloaded-marker"
          cmp "$marker_file" "$RUNNER_TEMP/downloaded-marker"

          printf 'rm "app/downloads/%s"\n' "$marker" > "$HOME/.ssh/remove.batch"
          sftp -q -b "$HOME/.ssh/remove.batch" -i "$HOME/.ssh/update_deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$UPDATE_SSH_USER@$UPDATE_SSH_HOST"
          uploaded=0

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "https://bymevpn.duckdns.org/app/downloads/$marker")"
          test "$status" = "404"
          echo "SFTP upload, HTTPS content verification, and cleanup passed."
