name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.3.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.3-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.3.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.3.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.3.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.3-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.3
        name: "ByMeVPN v1.0.3 (Fixed Xray Init & Happ Badges)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.3 — Исправлена инициализация Xray и добавлены бейджи протоколов

          #### Что исправлено:
          1. **Исправлен крах инициализации Xray `BaseKey must be 32 bytes`**: передача пустого ключа в `Libv2ray.initCoreEnv`, что предотвращает ошибочное включение XUDP шифрования с невалидным ключом.
          2. **Исправлен крах конфигурации `The feature allowInsecure has been removed`**: удален устаревший параметр `allowInsecure`, не поддерживаемый современными версиями Xray-core.
          3. **Серверы и протоколы как в Happ**: каждый сервер теперь имеет уникальный номер, название узла и визуальный бейдж протокола (`VLESS Reality`, `Hysteria 2`).
          4. **Прямое соединение без DNS-петель**: используется чистая маршрутизация `AsIs`.

          #### Прямые ссылки для скачивания (нажмите для загрузки):
          - 📥 **[Скачать ByMeVPN-v1.0.3.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.3/ByMeVPN-v1.0.3.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.3-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.3/ByMeVPN-v1.0.3-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая ссылка)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.3/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.3.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.3-debug.apk
          dist/ByMeVPN-v1.0.3.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
