name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.9.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.9-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.9.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.9.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.9.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.9-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.9
        name: "ByMeVPN v1.0.9 (Fix Traffic Routing & DNS Resolution)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.9 — Полное исправление маршрутизации трафика и DNS

          #### Что исправлено:
          1. **Исправлен конфликт адресации TUN-интерфейса**: клиент Android назначен `26.26.26.1/24`, виртуальный шлюз Xray TUN настроен как `26.26.26.2/24` — устранён коллизионный сброс пакетов ядром gVisor.
          2. **Устранено зависание Android I/O потоков**: удален вызов `builder.setBlocking(true)`, блокировавший асинхронный epoll/netpoller движка Xray (libv2ray).
          3. **Исключение серверного IP из VPN-маршрута (`excludeRoute`)**: серверный IP `2.27.120.247/32` исключён из маршрутизации через Android 13+ `excludeRoute` и в правилах Xray `direct`, предотвращая зацикливание сетевых сокетов (routing loops).
          4. **Устранение зависания DNS и IPv6**: удалён неработающий IPv6-маршрут (`::/0`), приводивший к зависанию браузеров по Happy Eyeballs; DNS переведён на быстрый прямой UDP-резолвинг (`1.1.1.1`, `8.8.8.8`, `77.88.8.8`) через VLESS туннель без зависаний DoH.
          5. **Автоматический выбор VLESS Reality**: Германия-2 (Reality) выбирается по умолчанию и выносится на первое место.

          #### Прямые ссылки для скачивания:
          - 📥 **[Скачать ByMeVPN-v1.0.9.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.9/ByMeVPN-v1.0.9.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.9-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.9/ByMeVPN-v1.0.9-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая ссылка на последний релиз)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.9/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.9.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.9-debug.apk
          dist/ByMeVPN-v1.0.9.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
