name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.5.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.5-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.5.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.5.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.5.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.5-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.5
        name: "ByMeVPN v1.0.5 (In-App Payments, Real Ping & Auto-Updates)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.5 — Оплата внутри приложения, реальный пинг и автообновление

          #### Что нового и улучшено:
          1. **Оплата прямо в приложении без перехода в Telegram**: встроена поддержка безопасной оплаты банковскими картами (МИР, Visa, Mastercard), СБП (Система быстрых платежей в 1 клик через приложение банка), SberPay, T-Pay, а также криптовалютой (USDT/TON/BTC).
          2. **Реальный TCP-пинг каждого узла**: в окне выбора серверов отображается реальный пинг в миллисекундах с цветными индикаторами (зеленый / желтый / коралловый).
          3. **Умный автовыбор**: режим «Автоматически» выбирает сервер с наименьшей реальной задержкой.
          4. **Встроенное автообновление APK**: при появлении свежего релиза приложение ненавязчиво предлагает обновиться в 1 клик.
          5. **Идеальная авторизация**: понятные сообщения об ошибках без системных кодов, защищенная сессия и моментальное сохранение.
          6. **100% динамические серверы из 3x-ui**: названия, IP и протоколы берутся из панели без правки кода.

          #### Прямые ссылки для скачивания (нажмите для загрузки):
          - 📥 **[Скачать ByMeVPN-v1.0.5.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.5/ByMeVPN-v1.0.5.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.5-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.5/ByMeVPN-v1.0.5-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая постоянная ссылка)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.5/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.5.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.5-debug.apk
          dist/ByMeVPN-v1.0.5.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
