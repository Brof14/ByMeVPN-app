name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.6.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.6-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.6.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.6.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.6.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.6-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.6
        name: "ByMeVPN v1.0.6 (Full Internet Routing & DNS Tunnel Fix)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.6 — Полная маршрутизация интернета и DNS туннелирование

          #### Что исправлено и улучшено:
          1. **Исправлена проблема «Входит в сеть, но интернет не грузит»**: 
             - Добавлен выделенный `dns-out` outbound обработчик в Xray-core и перехват DNS-запросов (port 53) с TUN-интерфейса в быстрый DoH (DNS-over-HTTPS via Cloudflare & Google).
             - Исключено зависание UDP DNS пакетов при работе через VLESS XTLS-Vision.
          2. **Устранена коллизия IP адресов TUN интерфейса**: 
             - Виртуальный IP перенесен на независимый пул `26.26.26.1/24`, исключая конфликты с локальными роутерами `10.0.0.0/8` и `192.168.0.0/16`.
             - Добавлен IPv6 шлюз (`fdfe:dcba:9876::1/126`) для предотвращения подвисания dual-stack мобильных сетей.
          3. **Оплата прямо в приложении без перехода в Telegram**: встроена поддержка банковских карт (МИР, Visa, Mastercard), СБП в 1 клик, а также криптовалюты.
          4. **Реальный TCP-пинг каждого узла**: серверы выводят реальную задержку в миллисекундах с цветными индикаторами.
          5. **Встроенное автообновление APK**: приложение автоматически проверяет наличие новых версий и предлагает обновиться.

          #### Прямые ссылки для скачивания (нажмите для загрузки):
          - 📥 **[Скачать ByMeVPN-v1.0.6.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.6/ByMeVPN-v1.0.6.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.6-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.6/ByMeVPN-v1.0.6-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая постоянная ссылка)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.6/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.6.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.6-debug.apk
          dist/ByMeVPN-v1.0.6.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
