name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.0.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.0-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.0.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.0.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.0.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.0-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "ByMeVPN v1.0.0 Release"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.0 — Официальный релиз

          #### Что включено:
          1. **Стабильный TUN-туннель Xray-core**: корректная неблокирующая обработка TUN-дескриптора, привязка физической сети `setUnderlyingNetworks` и отсутствие коллизий IP/шлюза.
          2. **VLESS XTLS-Vision + Reality**: подключение к высокоскоростным защищённым серверам без блокировок.
          3. **Исключение зависаний QUIC & DNS**: отключен перехват UDP 443 для чистого переключения на HTTP/2 TLS; прямая изоляция системных DNS-запросов от внутренних лупов Xray.
          4. **Полный UI экосистемы ByMeVPN**: стильный дизайн, выбор серверов, встроенная оплата, пинг нод.

          #### Прямые ссылки для скачивания:
          - 📥 **[Скачать ByMeVPN-v1.0.0.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.0/ByMeVPN-v1.0.0.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.0-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.0/ByMeVPN-v1.0.0-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая ссылка на последний релиз)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.0/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.0.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.0-debug.apk
          dist/ByMeVPN-v1.0.0.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
