name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Build a signed APK and AAB (requires release signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Keep this test build separate from an already installed production app.
      - run: gradle :app:assembleDebug -PsideBySideDebug=true -PpreviewSuffix=preview2 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-debug-side-by-side
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bymevpn-upload.jks"
      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bymevpn-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVER_ES256_PUBLIC_KEY: ${{ vars.SERVER_ES256_PUBLIC_KEY || secrets.SERVER_ES256_PUBLIC_KEY }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify APK release certificate
        env:
          EXPECTED_CERT_SHA256: 0C2160CEDAFAAE98B32AAF83F8B22229A67C98513DF93A8FE759EA910B177222
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$cert_output"
          actual="$(printf '%s\n' "$cert_output" | sed -nE 's/.*SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
      - name: Read app version
        id: app-version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          print(f'version={version}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-signed-${{ steps.app-version.outputs.version }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
