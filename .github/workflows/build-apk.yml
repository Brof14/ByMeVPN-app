name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Build a signed APK and AAB (requires release signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Keep this test build separate from an already installed production app.
      - run: gradle :app:assembleDebug -PsideBySideDebug=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-debug-side-by-side
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bymevpn-upload.jks"
      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bymevpn-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bymevpn-signed-1.0.0
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
