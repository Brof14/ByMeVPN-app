name: Build Android Release & Debug

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Ensure Upload Keystore
      run: |
        if [ ! -f "app/bymevpn-upload.jks" ]; then
          keytool -genkeypair -v -keystore app/bymevpn-upload.jks -alias bymevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass bymevpn2026 -keypass bymevpn2026 -dname "CN=ByMeVPN, OU=Mobile, O=ByMeVPN, L=Amsterdam, ST=NH, C=NL"
        fi

    - name: Build Google Play App Bundle (AAB) & Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease assembleRelease assembleDebug
        else
          gradle bundleRelease assembleRelease assembleDebug
        fi

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN-v1.0.8.apk
        cp app/build/outputs/apk/release/app-release.apk dist/ByMeVPN.apk
        cp app/build/outputs/apk/debug/app-debug.apk dist/ByMeVPN-v1.0.8-debug.apk
        cp app/build/outputs/bundle/release/app-release.aab dist/ByMeVPN-v1.0.8.aab

    - name: Upload Google Play Release Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-googleplay-bundle
        path: dist/ByMeVPN-v1.0.8.aab

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-release-apk
        path: dist/ByMeVPN-v1.0.8.apk

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-debug-apk
        path: dist/ByMeVPN-v1.0.8-debug.apk

    - name: Upload Keystore Backup
      uses: actions/upload-artifact@v4
      with:
        name: ByMeVPN-upload-keystore
        path: app/bymevpn-upload.jks

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.8
        name: "ByMeVPN v1.0.8 (Fix TunConfig unmarshal error)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### ByMeVPN v1.0.8 — Устранение ошибки структуры TunConfig

          #### Что исправлено:
          1. **Исправлена ошибка `cannot unmarshal bool into Go struct field TunConfig.autoOutboundsInterface`**: удален некорректный параметр типа bool, мешавший загрузке инбаунда tun.
          2. **Корректный TUN шлюз**: привязка шлюзов `gateway` (`26.26.26.1/24`, `fdfe:dcba:9876::1/126`) через строгий массив строк.
          3. **Приоритет VLESS Reality**: Германия-2 (порт 443) на первом месте.

          #### Прямые ссылки для скачивания:
          - 📥 **[Скачать ByMeVPN-v1.0.8.apk (Основная релизная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.8/ByMeVPN-v1.0.8.apk)**
          - 📥 **[Скачать ByMeVPN-v1.0.8-debug.apk (Отладочная версия)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.8/ByMeVPN-v1.0.8-debug.apk)**
          - 📥 **[Скачать ByMeVPN.apk (Прямая ссылка на последний релиз)](https://github.com/Brof14/ByMeVPN-app/releases/download/v1.0.8/ByMeVPN.apk)**
        files: |
          dist/ByMeVPN-v1.0.8.apk
          dist/ByMeVPN.apk
          dist/ByMeVPN-v1.0.8-debug.apk
          dist/ByMeVPN-v1.0.8.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
