name: Publish signed Android release on version bump

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts

permissions:
  contents: write

concurrency:
  group: bymevpn-android-version-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the Android version changed
        id: version_change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          def version(content):
              name = re.search(r'versionName\s*=\s*"(\d+\.\d+\.\d+)"', content)
              code = re.search(r'versionCode\s*=\s*(\d+)', content)
              if not name or not code:
                  raise SystemExit('Android versionName/versionCode is missing')
              return name.group(1), code.group(1)

          current = version(Path('app/build.gradle.kts').read_text())
          before = os.environ['BEFORE']
          previous = None if set(before) == {'0'} else version(subprocess.check_output(
              ['git', 'show', f'{before}:app/build.gradle.kts'], text=True
          ))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={current[0]}\n')
              output.write(f'changed={str(current != previous).lower()}\n')
          PY
      - uses: actions/setup-java@v4
        if: steps.version_change.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.version_change.outputs.changed == 'true'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version_change.outputs.changed == 'true'
        with:
          gradle-version: '8.11.1'

      - name: Verify version and unique release
        if: steps.version_change.outputs.changed == 'true'
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          content = Path("app/build.gradle.kts").read_text()
          name = re.search(r'versionName\s*=\s*"(\d+\.\d+\.\d+)"', content)
          code = re.search(r'versionCode\s*=\s*(\d+)', content)
          if not name or not code or int(code.group(1)) < 20:
              raise SystemExit("Expected a new Android versionName and versionCode >= 20")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"version={name.group(1)}\n")
              stream.write(f"code={code.group(1)}\n")
          PY
          tag="v${{ steps.version_change.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi

      - name: Run Android unit tests
        if: steps.version_change.outputs.changed == 'true'
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepare existing release signing key
        if: steps.version_change.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bymevpn-release.jks"
          chmod 600 "$RUNNER_TEMP/bymevpn-release.jks"

      - name: Build signed production APK
        if: steps.version_change.outputs.changed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bymevpn-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVER_ES256_PUBLIC_KEY: ${{ vars.SERVER_ES256_PUBLIC_KEY || secrets.SERVER_ES256_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_ES256_PUBLIC_KEY"
          gradle :app:assembleRelease :app:bundlePlay cyclonedxBom --no-daemon

      - name: Verify APK signature and fingerprint
        if: steps.version_change.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          EXPECTED_CERT_SHA256: 0C2160CEDAFAAE98B32AAF83F8B22229A67C98513DF93A8FE759EA910B177222
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          test -n "$(find "$apk_dir" -maxdepth 1 -name '*.apk' -print -quit)"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          for apk in "$apk_dir"/*.apk; do
            output="$("$apksigner" verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$output" | sed -nE 's/.*SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test "$actual" = "$EXPECTED_CERT_SHA256"
          done
          mkdir -p dist
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$apk_dir/app-$abi-release.apk" "dist/ByMeVPN-v$VERSION-$abi.apk"
          done
          cp "$apk_dir/app-universal-release.apk" "dist/ByMeVPN-v$VERSION.apk"
          aab="app/build/outputs/bundle/play/app-play.aab"
          test -s "$aab"
          jarsigner -verify "$aab"
          aab_cert="$(keytool -printcert -jarfile "$aab" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$aab_cert" = "$EXPECTED_CERT_SHA256"
          cp "$aab" "dist/ByMeVPN-v$VERSION-play.aab"
          cp build/reports/cyclonedx/bom.json "dist/ByMeVPN-v$VERSION-sbom.cdx.json"
          cp docs/XRAY_RUNTIME_PROVENANCE.md "dist/ByMeVPN-v$VERSION-native-runtime-provenance.md"
          sha256sum dist/*.apk dist/*.aab dist/*.json dist/*.md > dist/SHA256SUMS.txt
          VERSION="$VERSION" python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts").read_text()
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          version_code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
          def asset(name):
              path = Path("dist") / name
              return {
                  "download_url": f"https://github.com/Brof14/ByMeVPN-app/releases/download/v{version_name}/{name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          universal = f"ByMeVPN-v{version_name}.apk"
          manifest = {
              "version_name": version_name,
              "version_code": version_code,
              "download_url": asset(universal)["download_url"],
              "sha256": asset(universal)["sha256"],
              "abi_downloads": {
                  abi: asset(f"ByMeVPN-v{version_name}-{abi}.apk")
                  for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
              } | {"universal": asset(universal)},
              "release_notes": f"ByMeVPN {version_name} — ускорены повторные проверки, облегчены загрузки APK для каждой архитектуры."
          }
          Path("dist/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Publish verified APK to GitHub Releases
        if: steps.version_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<'EOF'
          **Для установки:** скачайте универсальный APK — файл `ByMeVPN-v...apk` без суффикса архитектуры. Для меньшего размера можно выбрать `arm64-v8a` — этот вариант подходит большинству современных телефонов.

          APK по архитектурам нужны для более компактных загрузок и автообновления. Файл `.aab` предназначен для загрузки через Google Play Console, а не для ручной установки. Каталог и обновления приложения используют `update.json`.
          EOF
          gh release create "v$VERSION" dist/*.apk dist/*.aab dist/update.json \
            --target "$GITHUB_SHA" \
            --title "ByMeVPN v$VERSION (Android)" \
            --notes-file dist/release-notes.md

      - name: Keep technical verification files in Actions
        if: steps.version_change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-${{ steps.release_version.outputs.version }}-technical-verification
          path: |
            dist/SHA256SUMS.txt
            dist/*-sbom.cdx.json
            dist/*-native-runtime-provenance.md
          if-no-files-found: error
          retention-days: 90
