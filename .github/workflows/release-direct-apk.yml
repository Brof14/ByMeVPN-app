name: Publish direct Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: direct-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          tag = os.environ['RELEASE_REF'].removeprefix('v')
          if not code or not name or int(code.group(1)) <= 0:
              raise SystemExit('Android versionCode/versionName is missing')
          if not re.fullmatch(r'\d+\.\d+\.\d+', tag):
              raise SystemExit('Release tag must use vMAJOR.MINOR.PATCH')
          if name.group(1) != tag:
              raise SystemExit(f'Release tag v{tag} does not match app version {name.group(1)}')
          print(f'Validated release tag v{tag} for app version {name.group(1)} (versionCode {code.group(1)})')
          PY
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bymevpn-release.jks"
          chmod 600 "$RUNNER_TEMP/bymevpn-release.jks"
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bymevpn-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVER_ES256_PUBLIC_KEY: ${{ vars.SERVER_ES256_PUBLIC_KEY || secrets.SERVER_ES256_PUBLIC_KEY }}
        run: |
          test -n "$SERVER_ES256_PUBLIC_KEY"
          gradle :app:assembleRelease --no-daemon
      - name: Verify APK and generate update manifest
        env:
          RELEASE_REF: ${{ github.ref_name }}
          EXPECTED_CERT_SHA256: 0C2160CEDAFAAE98B32AAF83F8B22229A67C98513DF93A8FE759EA910B177222
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          actual="$(printf '%s\n' "$cert_output" | sed -nE 's/.*SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          mkdir -p dist
          APK_PATH="$apk" python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          version = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          apk = Path(f'dist/ByMeVPN-v{version}.apk')
          shutil.copy2(os.environ['APK_PATH'], apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              'version_name': version,
              'version_code': code,
              'download_url': f'https://github.com/Brof14/ByMeVPN-app/releases/download/v{version}/{apk.name}',
              'sha256': digest,
              'release_notes': f'ByMeVPN {version} — исправления стабильности авторизации и состояния подписки.'
          }
          Path('dist/update.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_REF" dist/*.apk dist/update.json \
            --verify-tag \
            --title "ByMeVPN $RELEASE_REF" \
            --notes "Исправления стабильности входа, загрузки подписки и списка устройств."
      - uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-direct-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30